name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # A PR that touches ONLY these has nothing this reviewer can find, and a
    # skipped run costs six minutes and about three dollars less than one that
    # reads the whole codebase to say "no issues found". GitHub skips only when
    # EVERY changed file matches, so a mixed docs-plus-code PR still runs.
    # Checked 2026-09-04: no repo in the org uses branch protection, so a
    # skipped run cannot leave a required check pending forever.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/package-lock.json'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.svg'
      - '**/*.ico'
      - 'LICENSE'
  # Both issue_comment jobs below are gated on author_association. Without it
  # any GitHub user who can comment could start a job on the self-hosted runner
  # with the workflow's secrets in scope. The comment body is attacker-chosen
  # text, so the gate is on who wrote it, not on what it says.
  issue_comment:
    types: [created]

jobs:
  # Automatic review: runs on open and on every subsequent push to the branch,
  # except a push that changes nothing reviewable (see the skip check below).
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A rapid series of pushes only reviews the final state, instead of once
    # per push.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      # The PR can merge or close while this run sits in the queue (one
      # runner, one job at a time). PR 293 got a full review posted onto an
      # already-merged PR this way. Check the LIVE state, not the payload's.
      - name: Check the PR is still open
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "PR state: $state"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.state == 'OPEN'
        with:
          fetch-depth: 0

      # The agent used to open every review by asking the API what had already
      # been said, three or four turns before it could start reading code. Those
      # calls cost nothing here, so the answer is waiting for it as a file, and
      # the scope decision is made from that answer instead of from the event
      # name. Runs after checkout because it validates the before-SHA against
      # the actual repository.
      - name: Collect prior review context
        id: prior
        if: steps.gate.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews"   --paginate > "$RUNNER_TEMP/reviews.json"
          gh api "repos/$REPO/pulls/$PR/comments"  --paginate > "$RUNNER_TEMP/inline.json"
          gh api "repos/$REPO/issues/$PR/comments" --paginate > "$RUNNER_TEMP/issue.json"
          # --paginate emits one array per page, so `add` flattens them back
          # into a single list. `add` on an empty slurp is null, hence `[]?`.
          jq -n \
            --slurpfile r "$RUNNER_TEMP/reviews.json" \
            --slurpfile i "$RUNNER_TEMP/inline.json" \
            --slurpfile c "$RUNNER_TEMP/issue.json" \
            '{reviews:  [$r | add[]? | {user: .user.login, state, body, submitted_at}],
              inline:   [$i | add[]? | {user: .user.login, path, line, body}],
              comments: [$c | add[]? | {user: .user.login, body, created_at}]}' \
            > "$RUNNER_TEMP/prior-review.json"
          n=$(jq '[.reviews[], .inline[] | select(.user | test("claude|github-actions"; "i"))] | length' \
                "$RUNNER_TEMP/prior-review.json")

          # An incremental range is only safe when there IS a previous review to
          # be incremental to AND we know where it stopped. `github.event.before`
          # is set on `synchronize` and on nothing else, so on opened, reopened
          # and ready_for_review it is the empty string, and using it unchecked
          # builds `git diff ..HEAD`, which is malformed. Anything unusable
          # falls back to the whole PR, which is the safe direction to fail in.
          # A force-push (rebase, amend) leaves the old head reachable from no
          # branch, so the full clone above does not carry it. GitHub still
          # serves it by SHA for a while, and without it a rebase that changed
          # nothing gets a full re-review, so try once before giving up.
          if [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --quiet origin "$BEFORE" 2>/dev/null || true
          fi
          if [ "$n" -gt 0 ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mode=incremental; range="$BEFORE..$HEAD_SHA"
          else
            mode=full;        range="$BASE_SHA...$HEAD_SHA"
          fi
          echo "mode=$mode"   >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Prior review artefacts by this reviewer: $n -> $mode ($range)"

          # Skip the review when the push cannot contain anything new. Over
          # 2026-08-29..09-12, 33 of 245 follow-up reviews opened with
          # "identical tree", "this push is the qa merge" or "docstring-only",
          # each a 2-3 minute Opus run to say nothing. The test is exact: the
          # PR's NET diff against its base, at the previously reviewed head and
          # at the new one, with the trigger's paths-ignore list applied and
          # the index/hunk-header lines dropped so line-number shifts do not
          # count. A rebase, an amend, a clean merge of the base branch into
          # the PR (the before..head range is then full of code reviewed on
          # other PRs) and a docs-only push all compare equal; a conflict
          # resolution or any real edit does not. Every failure path runs the
          # review, which is the safe direction.
          skip=false
          ignore=(':(exclude,glob)**/*.md' ':(exclude)docs'
                  ':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/poetry.lock'
                  ':(exclude,glob)**/uv.lock' ':(exclude,glob)**/*.png'
                  ':(exclude,glob)**/*.jpg' ':(exclude,glob)**/*.svg'
                  ':(exclude,glob)**/*.ico' ':(exclude)LICENSE')
          net() {  # $1 = commit, $2 = output file
            local mb
            mb=$(git merge-base "$BASE_SHA" "$1") || return 1
            git diff -U0 --no-color "$mb" "$1" -- "${ignore[@]}" > "$2.raw" || return 1
            grep -v -e '^index ' -e '^@@ ' "$2.raw" > "$2" || true
          }
          if [ "$mode" = incremental ] \
             && net "$BEFORE"   "$RUNNER_TEMP/net-before.diff" \
             && net "$HEAD_SHA" "$RUNNER_TEMP/net-head.diff" \
             && cmp -s "$RUNNER_TEMP/net-before.diff" "$RUNNER_TEMP/net-head.diff"; then
            skip=true
            echo "::notice::Review skipped: the PR's net diff is unchanged since the last review ($(git rev-list --count "$BEFORE..$HEAD_SHA") new commit(s), $(wc -l < "$RUNNER_TEMP/net-head.diff") net diff lines, identical)."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Named so the on-demand gate can tell from the jobs API whether this
      # step ran or was skipped by the check above.
      - name: Review
        uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.state == 'OPEN' && steps.prior.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request.

            REPO:       ${{ github.repository }}
            PR NUMBER:  ${{ github.event.pull_request.number }}
            EVENT:      ${{ github.event.action }}
            BASE SHA:   ${{ github.event.pull_request.base.sha }}
            HEAD SHA:   ${{ github.event.pull_request.head.sha }}
            BEFORE SHA: ${{ github.event.before }}

            The PR branch is already checked out with full history.

            WORK IN PARALLEL. Every message you send costs about eleven seconds
            of wall clock, and that is the whole reason a review takes ten
            minutes instead of three. When you need several independent things,
            put them in ONE message: several Reads together, several Greps
            together, a Grep and a git call together. Wait for a result only
            when the next call genuinely depends on it.

            THE TOOLS YOU HAVE. This is the entire list. A call outside it is
            refused and still costs you a full round trip, so do not probe for
            anything else: TodoWrite, Read, Grep, Glob, Write, read-only git (diff, log, show, status, blame, grep,
            ls-files, ls-tree, rev-parse, rev-list, merge-base, cat-file,
            branch, tag), read-only gh (pr view, pr diff, pr list, pr checks,
            issue view, issue list, search, repo view, api) and read-only shell
            (ls, cat, head, tail, wc, cut, sort, uniq, tr, grep, rg, find,
            basename, dirname, realpath, stat, file, jq, diff, sed, awk, od,
            xxd, echo). There is no web fetch, no package manager, no test
            runner, no way to write into the repository and no way to run the
            code.

            FIRST, read the prior-review context. The workflow has already
            fetched it for you, so this is one Read instead of three API calls:
              ${{ runner.temp }}/prior-review.json
            It holds every review, inline comment and issue comment on this PR.

            SCOPE: this run is ${{ steps.prior.outputs.mode }}. Review exactly
            this range, which the workflow has already worked out for you:

              git diff ${{ steps.prior.outputs.range }}

            The mode was decided from the prior-review file above, by looking
            for a review of your own, NOT from the event name: an earlier run
            can fail or never happen, so "synchronize" does not prove a review
            exists.

              - full means that range is the WHOLE pull request. Earlier
                commits have never been looked at, so do not narrow it to the
                latest push or you will silently skip them.

              - incremental means that range is only what changed since your
                last review. Do NOT repeat a finding you already posted; a
                duplicate is worse than silence. If a previous finding now
                looks fixed, note it in one line in the summary rather than
                raising it again. If nothing new is worth flagging, post a
                one-line summary saying so and stop.

            If git shows any changed file as binary, do NOT accept a benign
            explanation for it and do not skim past it. Re-diff it with
            `git diff --text`, and establish exactly why git classifies it
            as binary: for a source file that usually means a stray control
            byte, for example a NUL typed into a string literal. A text file
            that git treats as binary is itself a reportable defect, because
            it hides the file from diff and blame for everyone after you.

            The diff being consistent with itself is not enough. Use Grep and
            Read to check the change's assumptions against the rest of the
            codebase before accepting them:
              - A route or link target: does it exist, and can every user
                who will see the link actually open it (authorisation)?
              - A count or "N more" shown to users: is the underlying query
                capped or paginated, making the number wrong past the cap?
              - A key, sentinel or constant this diff defines: is it already
                defined elsewhere, or duplicated where it should be imported?
              - A condition on one property standing in for another (for
                example "has a header" standing in for "has a destination"):
                enumerate the real cases in the codebase and check each one,
                not just the cases the author had in mind.
            Most real defects in a PR are visible only from outside its diff.

            Review the changes for, in priority order:
              1. Correctness bugs: logic errors, off-by-one, inverted
                 conditionals, unhandled null/None, race conditions, error
                 handling that swallows failures
              2. Security: injection, committed secrets, missing authorisation
                 checks, user input reaching a shell or a query
              3. Data loss: destructive operations without a guard, migrations
                 that are not backward compatible
              4. Performance problems that would actually bite: N+1 queries,
                 unbounded loops over network calls

            Follow any CLAUDE.md in the repository.

            Do NOT report:
              - Formatting, naming, or style preferences
              - Missing tests, unless the change is genuinely high risk
              - Anything the repository's own CI already checks
              - Speculative issues you cannot point at a specific line for

            Verify before you post. If you assert a behaviour, cite the file
            and line that demonstrates it; do not infer it from a function
            name. A false positive costs the author more than a missed nit.

            How to post:
              - Post the whole round as ONE review submission: the summary as
                the review body, every line-anchored finding as an inline
                comment in the SAME call. This gives the PR timeline a single
                entry instead of one per comment. Heredocs, pipes and stdin
                are blocked here, so FIRST use the Write tool to put the JSON
                payload at /tmp/review-payload.json (never inside the repo
                checkout):

                  {
                    "event": "COMMENT",
                    "body": "2 issues, 1 minor. <short overall summary>",
                    "comments": [
                      {"path": "app/example.py", "line": 42, "side": "RIGHT",
                       "body": "<the finding>"}
                    ]
                  }

                then submit it (REPO and PR NUMBER are given above):

                  gh api repos/<REPO>/pulls/<PR NUMBER>/reviews --input /tmp/review-payload.json

              - "event" is always COMMENT, never APPROVE or REQUEST_CHANGES.
              - Open the body with a tally, for example "2 issues, 1 minor".
                If you found nothing, the body is "No issues found" and
                "comments" is an empty array (still one review, so the PR
                shows it was looked at).
              - Every inline comment must anchor to a line that appears in
                THIS PR's diff, on side RIGHT (add "start_line" for a range).
                A finding with no such line to point at goes in the review
                body instead, cited as path:line.
              - If the POST returns 422, the error names the comment it
                rejected: fix that anchor, or move that finding into the
                body, then retry. One bad anchor otherwise loses the whole
                batch.
              - At most 10 inline comments. If you found more, include the 10
                most serious and give the remaining count in the body.
              - Post findings only through this one review call. Do not post
                separate per-finding reviews, do not post an extra summary
                comment, and do not write the review out as a chat message.
          # `Write` is unrestricted, and that is not an oversight. Every
          # permission denial this job has ever logged was a Write: the prompt
          # below tells the model to put its review payload at
          # /tmp/review-payload.json, and `Write(/tmp/**)` refuses exactly that.
          # Probed directly on 2026-09-04: Write(/tmp/**), Write(/tmp/*),
          # Write(//tmp/**), Write(/tmp/**/*), Write(payload.json),
          # Write(./payload.json) and Write(**) are ALL refused, and only a bare
          # `Write` is granted. Path scoping on this tool does not work in Claude
          # Code 2.1.260, so the choice is an unscoped Write or a reviewer that
          # cannot post. It burned 26% of every run's turns before this.
          #
          # What that does NOT open up: the job is `contents: read`, so it still
          # cannot push; the runner has no Docker socket; and the workspace is
          # deleted at job cleanup. The rest of the list stays strictly
          # read-only, with nothing that fetches from the network, installs, or
          # executes the project.
          #
          # Opus at high effort, always: PR 293 showed Sonnet single-pass
          # missing 10 verified defects. Fall back to Sonnet rather than
          # failing the run if Opus is unavailable. 40 turns was not enough
          # for a PR whose main file needed --text re-diffing; 80 gives the
          # cross-codebase checks room.
          claude_args: |
            --model opus
            --effort high
            --fallback-model sonnet
            --max-turns 80
            --allowedTools "TodoWrite,Glob,Grep,Read,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh repo view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git blame:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git merge-base:*),Bash(git cat-file:*),Bash(git branch:*),Bash(git tag:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cut:*),Bash(sort:*),Bash(uniq:*),Bash(tr:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(basename:*),Bash(dirname:*),Bash(realpath:*),Bash(stat:*),Bash(file:*),Bash(jq:*),Bash(diff:*),Bash(sed:*),Bash(awk:*),Bash(od:*),Bash(xxd:*),Bash(echo:*),Bash(test:*)"

  # On-demand review: "@claude review" on an existing PR.
  #
  # GitHub decides which workflows a pull_request event runs from the BASE side,
  # but it only re-decides when the branch is pushed to. A PR opened before this
  # file reached its base branch therefore never picks the review job up, and
  # reopening it does not help: the merge ref is recomputed, the workflow set is
  # not. This job is the lever for those PRs, and for re-running a review by
  # hand. It reuses the review prompt rather than the interactive assistant,
  # which is built for answering and editing, not reviewing.
  review_on_demand:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude review') &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately NOT the same group as the automatic review job: sharing
    # it meant an "@claude review" comment cancelled an in-flight automatic
    # review (seen on PR 293, 4 seconds in). The runner serialises them
    # anyway, and the gate below skips this job when the automatic review
    # already covers the PR's current head commit.
    concurrency:
      group: claude-review-ondemand-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Check the PR is still open and not already covered
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --json state -q .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "PR state: $state"

          # Skip when the AUTOMATIC review job is already queued, running, or
          # finished successfully for the PR's current head commit: a push and
          # an "@claude review" comment seconds apart otherwise produce two
          # full reviews of the same commit (seen on es-internal PR 299).
          # Failed and cancelled runs do not count, so this job still serves
          # as the retry path, and PRs from before the workflow existed have
          # no pull_request runs at all and proceed as before.
          head_sha=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --json headRefOid -q .headRefOid)
          covered=0
          for run in $(gh api "repos/${{ github.repository }}/actions/workflows/claude-review.yml/runs?event=pull_request&head_sha=$head_sha" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or (.status == "completed" and .conclusion == "success")) | "\(.id):\(.status)"'); do
            if [ "${run##*:}" != completed ]; then covered=$((covered+1)); continue; fi
            # A finished run only covers the commit if its Review step actually
            # ran. The automatic job skips itself when a push changes nothing
            # reviewable (rebase, base merge, docs-only), and a typed
            # "@claude review" must still get through in that case. Older
            # workflow versions left the step unnamed, hence the second match.
            ran=$(gh api "repos/${{ github.repository }}/actions/runs/${run%%:*}/jobs" \
              --jq '[.jobs[] | select(.name == "review") | .steps[]
                     | select((.name == "Review" or (.name | startswith("Run anthropics/claude-code-action"))) and .conclusion == "success")] | length')
            [ "$ran" -gt 0 ] && covered=$((covered+1))
          done
          echo "covered=$covered" >> "$GITHUB_OUTPUT"
          echo "Automatic review runs covering $head_sha: $covered"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.state == 'OPEN' && steps.gate.outputs.covered == '0'
        with:
          fetch-depth: 0

      # Same pre-fetch as the automatic job. No range: an on-demand review is
      # always of the whole PR, so there is no before-SHA to trust.
      - name: Collect prior review context
        id: prior
        if: steps.gate.outputs.state == 'OPEN' && steps.gate.outputs.covered == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews"   --paginate > "$RUNNER_TEMP/reviews.json"
          gh api "repos/$REPO/pulls/$PR/comments"  --paginate > "$RUNNER_TEMP/inline.json"
          gh api "repos/$REPO/issues/$PR/comments" --paginate > "$RUNNER_TEMP/issue.json"
          jq -n \
            --slurpfile r "$RUNNER_TEMP/reviews.json" \
            --slurpfile i "$RUNNER_TEMP/inline.json" \
            --slurpfile c "$RUNNER_TEMP/issue.json" \
            '{reviews:  [$r | add[]? | {user: .user.login, state, body, submitted_at}],
              inline:   [$i | add[]? | {user: .user.login, path, line, body}],
              comments: [$c | add[]? | {user: .user.login, body, created_at}]}' \
            > "$RUNNER_TEMP/prior-review.json"
          echo "Prior review context written for PR $PR"

      # The action checks the PR branch out itself when the comment is on a PR.
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.state == 'OPEN' && steps.gate.outputs.covered == '0'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request, asked for by hand.

            REPO:       ${{ github.repository }}
            PR NUMBER:  ${{ github.event.issue.number }}

            The PR branch is already checked out with full history. There is no
            pull_request payload on this event, so establish the range yourself:

              gh pr view ${{ github.event.issue.number }} --json baseRefName,headRefName,headRefOid

            then review the whole PR:

              git diff origin/<baseRefName>...HEAD


            WORK IN PARALLEL. Every message you send costs about eleven seconds
            of wall clock, and that is the whole reason a review takes ten
            minutes instead of three. When you need several independent things,
            put them in ONE message: several Reads together, several Greps
            together, a Grep and a git call together. Wait for a result only
            when the next call genuinely depends on it.

            THE TOOLS YOU HAVE. This is the entire list. A call outside it is
            refused and still costs you a full round trip, so do not probe for
            anything else: TodoWrite, Read, Grep, Glob, Write, read-only git (diff, log, show, status, blame, grep,
            ls-files, ls-tree, rev-parse, rev-list, merge-base, cat-file,
            branch, tag), read-only gh (pr view, pr diff, pr list, pr checks,
            issue view, issue list, search, repo view, api) and read-only shell
            (ls, cat, head, tail, wc, cut, sort, uniq, tr, grep, rg, find,
            basename, dirname, realpath, stat, file, jq, diff, sed, awk, od,
            xxd, echo). There is no web fetch, no package manager, no test
            runner, no way to write into the repository and no way to run the
            code.

            FIRST, read the prior-review context. The workflow has already
            fetched it for you, so this is one Read instead of three API calls:
              ${{ runner.temp }}/prior-review.json
            It holds every review, inline comment and issue comment on this PR.

            If you find a prior review of your own, do not repeat its findings.
            Note in one line any that now look fixed, and concentrate on
            anything it did not cover. If nothing is worth flagging, say so in
            one line and stop.

            If git shows any changed file as binary, do NOT accept a benign
            explanation for it and do not skim past it. Re-diff it with
            `git diff --text`, and establish exactly why git classifies it
            as binary: for a source file that usually means a stray control
            byte, for example a NUL typed into a string literal. A text file
            that git treats as binary is itself a reportable defect, because
            it hides the file from diff and blame for everyone after you.

            The diff being consistent with itself is not enough. Use Grep and
            Read to check the change's assumptions against the rest of the
            codebase before accepting them:
              - A route or link target: does it exist, and can every user
                who will see the link actually open it (authorisation)?
              - A count or "N more" shown to users: is the underlying query
                capped or paginated, making the number wrong past the cap?
              - A key, sentinel or constant this diff defines: is it already
                defined elsewhere, or duplicated where it should be imported?
              - A condition on one property standing in for another (for
                example "has a header" standing in for "has a destination"):
                enumerate the real cases in the codebase and check each one,
                not just the cases the author had in mind.
            Most real defects in a PR are visible only from outside its diff.

            Review the changes for, in priority order:
              1. Correctness bugs: logic errors, off-by-one, inverted
                 conditionals, unhandled null/None, race conditions, error
                 handling that swallows failures
              2. Security: injection, committed secrets, missing authorisation
                 checks, user input reaching a shell or a query
              3. Data loss: destructive operations without a guard, migrations
                 that are not backward compatible
              4. Performance problems that would actually bite: N+1 queries,
                 unbounded loops over network calls

            Follow any CLAUDE.md in the repository.

            Do NOT report:
              - Formatting, naming, or style preferences
              - Missing tests, unless the change is genuinely high risk
              - Anything the repository's own CI already checks
              - Speculative issues you cannot point at a specific line for

            Verify before you post. If you assert a behaviour, cite the file
            and line that demonstrates it; do not infer it from a function
            name. A false positive costs the author more than a missed nit.

            How to post:
              - Post the whole round as ONE review submission: the summary as
                the review body, every line-anchored finding as an inline
                comment in the SAME call. This gives the PR timeline a single
                entry instead of one per comment. Heredocs, pipes and stdin
                are blocked here, so FIRST use the Write tool to put the JSON
                payload at /tmp/review-payload.json (never inside the repo
                checkout):

                  {
                    "event": "COMMENT",
                    "body": "2 issues, 1 minor. <short overall summary>",
                    "comments": [
                      {"path": "app/example.py", "line": 42, "side": "RIGHT",
                       "body": "<the finding>"}
                    ]
                  }

                then submit it (REPO and PR NUMBER are given above):

                  gh api repos/<REPO>/pulls/<PR NUMBER>/reviews --input /tmp/review-payload.json

              - "event" is always COMMENT, never APPROVE or REQUEST_CHANGES.
              - Open the body with a tally, for example "2 issues, 1 minor".
                If you found nothing, the body is "No issues found" and
                "comments" is an empty array (still one review, so the PR
                shows it was looked at).
              - Every inline comment must anchor to a line that appears in
                THIS PR's diff, on side RIGHT (add "start_line" for a range).
                A finding with no such line to point at goes in the review
                body instead, cited as path:line.
              - If the POST returns 422, the error names the comment it
                rejected: fix that anchor, or move that finding into the
                body, then retry. One bad anchor otherwise loses the whole
                batch.
              - At most 10 inline comments. If you found more, include the 10
                most serious and give the remaining count in the body.
              - Post findings only through this one review call. Do not post
                separate per-finding reviews, do not post an extra summary
                comment, and do not write the review out as a chat message.
          # See the automatic review job for why Opus at high effort and 80
          # turns. The first on-demand run on PR 293 died at 40 turns
          # without posting anything.
          claude_args: |
            --model opus
            --effort high
            --fallback-model sonnet
            --max-turns 80
            --allowedTools "TodoWrite,Glob,Grep,Read,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh repo view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git blame:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git merge-base:*),Bash(git cat-file:*),Bash(git branch:*),Bash(git tag:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cut:*),Bash(sort:*),Bash(uniq:*),Bash(tr:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(basename:*),Bash(dirname:*),Bash(realpath:*),Bash(stat:*),Bash(file:*),Bash(jq:*),Bash(diff:*),Bash(sed:*),Bash(awk:*),Bash(od:*),Bash(xxd:*),Bash(echo:*),Bash(test:*)"

  # On-demand: someone writes "@claude ..." in a PR or issue comment. Anything
  # starting "@claude review" is handled by the job above instead.
  mention:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review') &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Deliberately read-only on contents: this job runs on the HTPC, which
      # also hosts Immich, Nextcloud, Plex and Polymarket. @claude can answer
      # and review on demand, but cannot push commits.
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No `prompt` input, so the action runs in interactive mode and answers
      # whatever was actually written after @claude.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without an explicit --allowedTools this job inherits the action's
          # restrictive default set, which has no `git diff`, no `gh` and no
          # comment tool: it cannot read a diff or answer, so it burns every
          # turn on permission denials and dies on the turn limit. Same read
          # tools as the review jobs, plus the comment tools so it can answer
          # (the review jobs post via the reviews API instead), minus anything
          # that writes to the repo (see the contents: read note above).
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh issue comment:*),TodoWrite,Glob,Grep,Read,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh repo view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git blame:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git merge-base:*),Bash(git cat-file:*),Bash(git branch:*),Bash(git tag:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cut:*),Bash(sort:*),Bash(uniq:*),Bash(tr:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(basename:*),Bash(dirname:*),Bash(realpath:*),Bash(stat:*),Bash(file:*),Bash(jq:*),Bash(diff:*),Bash(sed:*),Bash(awk:*),Bash(od:*),Bash(xxd:*),Bash(echo:*),Bash(test:*)"
