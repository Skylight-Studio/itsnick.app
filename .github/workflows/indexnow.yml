name: Submit to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'og-image.png'

jobs:
  submit:
    # GitHub-hosted: this repository is public, so hosted minutes are free and
    # do not count against the org's 2,000-minute private quota. The HTPC
    # runner group no longer accepts public repositories, so a job labelled
    # `htpc` here just sits queued until it times out.
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "itsnick.app",
              "key": "86714d0204146046e1a7143aa380792a",
              "keyLocation": "https://itsnick.app/86714d0204146046e1a7143aa380792a.txt",
              "urlList": ["https://itsnick.app/"]
            }'
