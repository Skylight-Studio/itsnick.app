name: Submit to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'og-image.png'

jobs:
  submit:
    # Self-hosted: eight runners on the HTPC, all labelled `htpc`. The
    # Skylight-Studio org is on the GitHub free plan -- 2,000 GitHub-hosted
    # Actions minutes a month across 14 private repos -- and exhausting that
    # quota blocks hosted runners org-wide, presenting as a 2-3 second red
    # build with no log rather than an honest billing error. Self-hosted
    # minutes are unmetered. This job only needs curl, which the runner image
    # ships.
    runs-on: [self-hosted, htpc]
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "itsnick.app",
              "key": "86714d0204146046e1a7143aa380792a",
              "keyLocation": "https://itsnick.app/86714d0204146046e1a7143aa380792a.txt",
              "urlList": ["https://itsnick.app/"]
            }'
